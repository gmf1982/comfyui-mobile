name: Release portable build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-portable.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Windows x64 免安装绿色版：解压后双击 ComfyUI-Mobile.exe 即可运行网关（自带 Node 运行时）。
            首次运行若 SmartScreen 拦截：更多信息 → 仍要运行（程序未代码签名）。
